name: cache-keepalive

# Keep GitHub Actions Gradle cache alive (expiry: 7 days of inactivity).
# Periodic restore counts as access and renews it. No build, no artifacts.
# Resource use: ~1 minute per run, every 5 days.

on:
  schedule:
    - cron: '0 0 */5 * *' # every 5 days UTC
  workflow_dispatch:

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Touch debug Gradle cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: gradle-${{ runner.os }}-debug-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-debug-
            gradle-${{ runner.os }}-

      - name: Touch release Gradle cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: gradle-${{ runner.os }}-release-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-release-
            gradle-${{ runner.os }}-
