name: prune-artifacts

# GitHub Free 的 artifact 额度只有 500MB（与 Packages 共享同一份配额），
# 超过后新的上传会失败。retention-days 管住单个制品，这里再兜一层：
# 每天删掉 3 天前的所有 artifact（谁忘了设 retention 也不会把额度囤满）。
# cache 不算在这 500MB 里（独立 10GB/仓库），所以这里只动 artifact。

on:
  schedule:
    - cron: '0 3 * * *' # 11:00 CST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Delete artifacts older than 3 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '3 days ago' +%s)
          echo "cutoff: $(date -u -d @$cutoff)"
          before=$(gh api "repos/$REPO/actions/artifacts?per_page=1" --jq '.total_count')
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select((.created_at | fromdate) < $cutoff) | \"\(.id) \(.size_in_bytes) \(.name)\"" \
            | while read -r id size name; do
                gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
                echo "deleted $name ($id, $((size / 1024 / 1024)) MB)"
              done
          after=$(gh api "repos/$REPO/actions/artifacts?per_page=1" --jq '.total_count')
          echo "artifacts: $before -> $after"
